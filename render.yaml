# Render Blueprint - free-tier Docker web service.
# Database: set DATABASE_URL in the Render dashboard (Render Postgres "Internal Database URL" or a
# Supabase connection string) so data survives restarts. Without it the app falls back to SQLite,
# whose file is wiped on every deploy on the free tier.
services:
  - type: web
    name: ipswich-retail
    runtime: docker
    plan: free
    healthCheckPath: /health/
    autoDeploy: false   # deployments are triggered by the GitHub Actions deploy hook
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste your PostgreSQL connection string in the dashboard
      - key: SQLITE_PATH     # only used when DATABASE_URL is not set
        value: /tmp/db.sqlite3
      - key: DEMO_ADMIN_PASSWORD
        value: Admin@12345
      - key: DEMO_CUSTOMER_PASSWORD
        value: Customer@12345
