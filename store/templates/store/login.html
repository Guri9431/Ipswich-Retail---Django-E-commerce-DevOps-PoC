{% extends "store/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" class="form narrow">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Login</button>
  <p>No account? <a href="{% url 'store:register' %}">Register</a></p>
</form>
{% endblock %}
