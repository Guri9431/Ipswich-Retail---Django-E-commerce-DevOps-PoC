name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: ipswich-retail

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 . --exclude=migrations,venv,.venv,staticfiles --max-line-length=120

      - name: Django system check
        run: python manage.py check

      - name: Verify no missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Unit, integration and end-to-end tests with coverage
        run: |
          coverage run --source=store manage.py test -v 2
          coverage report --fail-under=80
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build-and-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY=ci-smoke-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SECURE_COOKIES=False \
            $IMAGE_NAME:${{ github.sha }}

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ ; then echo; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Smoke test key pages and metrics
        run: |
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/cart/
          curl -fsS http://localhost:8000/metrics | grep -q django_http

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build-and-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping deploy"; exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Post-deploy health check
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then echo "LIVE_URL not set - skipping"; exit 0; fi
          sleep 90
          for i in $(seq 1 20); do
            if curl -fsS "$LIVE_URL/health/"; then echo; exit 0; fi
            sleep 15
          done
          echo "Live health check failed"; exit 1

  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build-and-smoke-test, deploy]
    if: always()
    steps:
      - name: Send Slack message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT_TEST: ${{ needs.lint-and-test.result }}
          RESULT_DOCKER: ${{ needs.docker-build-and-smoke-test.result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set - skipping"; exit 0; fi
          curl -fsS -X POST -H 'Content-type: application/json' --data "{
            \"text\": \"*${GITHUB_REPOSITORY}* \`${GITHUB_REF_NAME}\` by ${GITHUB_ACTOR}: tests=${RESULT_TEST}, docker=${RESULT_DOCKER}, deploy=${RESULT_DEPLOY} - <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|view run>\"
          }" "$SLACK_WEBHOOK_URL"
