# Local / staging stack: app + PostgreSQL + Prometheus + Grafana
#   docker compose up --build
# App:        http://localhost:8000
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000  (admin / admin)
#
# The app uses PostgreSQL here via DATABASE_URL. To use an external database (e.g. Supabase)
# set DATABASE_URL in your shell or an .env file before running `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    container_name: ipswich-db
    environment:
      POSTGRES_DB: ipswich
      POSTGRES_USER: ipswich
      POSTGRES_PASSWORD: ipswich
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 so the check only passes once the real server (not the init-time one) is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ipswich -d ipswich"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    container_name: ipswich-web
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-insecure-key-change-me-in-production}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DATABASE_URL: "${DATABASE_URL:-postgres://ipswich:ipswich@db:5432/ipswich}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ipswich-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ipswich-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
