groups:
  - name: ipswich-retail
    rules:
      - alert: AppDown
        expr: up{job="django-web"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ipswich Retail web app is down"

      - alert: HighErrorRate
        expr: sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 0.05 5xx responses per second"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency above 1s"
